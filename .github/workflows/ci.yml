name: CI / CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── 1. Backend CI ────────────────────────────────────────────────────────────
  backend:
    name: Backend CI (PHP 8.3 + PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: apps/api
        run: composer install -q --no-ansi --no-interaction --no-scripts --prefer-dist

      - name: Copy .env
        working-directory: apps/api
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate App Key
        working-directory: apps/api
        run: php artisan key:generate --no-interaction

      - name: Run Pint (Code Style)
        working-directory: apps/api
        run: vendor/bin/pint --test

      - name: Run PHPUnit (All Gates)
        working-directory: apps/api
        run: vendor/bin/phpunit --testdox

  # ── 2. Frontend CI ───────────────────────────────────────────────────────────
  frontend:
    name: Frontend CI (Node 22 + Next.js 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript strict check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Production build
        working-directory: apps/web
        run: npm run build

  # ── 3. Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Composer audit (PHP dependencies)
        working-directory: apps/api
        run: composer audit --no-interaction || true

      - name: npm audit (Node dependencies)
        working-directory: apps/web
        run: npm audit --audit-level=high || true

  # ── 4. Build & push Docker images ───────────────────────────────────────────
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Deployment gate (production — requires explicit approval) ──────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST:     ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER:     ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG:       ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::notice ::Production deployment secrets (DEPLOY_HOST / DEPLOY_SSH_KEY) are not configured yet. Skipping SSH deployment."
            exit 0
          fi
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/lms && IMAGE_TAG=$IMAGE_TAG bash infrastructure/scripts/deploy.sh"
          rm -f /tmp/deploy_key

      - name: Notify deployment
        if: always()
        run: echo "Deployment to production completed with status ${{ job.status }}"
